<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#4f46e5,#3b82f6);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-image: url('bg.jpg');
    background-size: cover;
    background-attachment: fixed;
}

/* BOX */
.login-box{
    background:white;
    padding:40px;
    border-radius:20px;
    width:300px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

/* TITLE */
.login-box h2{
    margin-bottom:25px;
    font-size:24px;
}

/* INPUT */
.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #e2e8f0;
    border-radius:10px;
    font-size:14px;
    transition:0.2s;
}

/* FOCUS EFFECT */
.login-box input:focus{
    outline:none;
    border-color:#4f46e5;
    box-shadow:0 0 0 3px rgba(79,70,229,0.2);
}

/* BUTTON */
.login-btn{
    display:block;
    width:100%;
    margin-top:15px;
    padding:12px;
    background:#4f46e5;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
    transition:0.2s;
}

.login-btn:hover{
    background:#4338ca;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Đăng nhập</h2>

    <input type="text" placeholder="Tên đăng nhập">
    <input type="password" placeholder="Mật khẩu">

    <a href="home.html" class="login-btn">Đăng nhập</a>
</div>

</body>
</html>
